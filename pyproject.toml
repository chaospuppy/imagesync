[project]
name = "imagesync"
version = "0.1.0"
description = "Tool used to sync images contained in image.yaml from original location to the configured destination registry"
authors = ["Tim Seagren <seagren.tim@solute.us>"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ibmodules",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[tool.uv.sources]
ibmodules = { git = "https://repo1.dso.mil/ironbank-tools/ironbank-modules.git", subdirectory = "ironbank", tag = "0.0.3" }
